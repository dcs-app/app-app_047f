<script data-trd-carbon-badge="1">
(function(){
  try {
    var verifyUrl = "https://api.dcsai.ai/api/storage/receipts/7ec09089-1f5d-4109-96ad-40321bc55ed2";
    var el = document.getElementById('trd-cb-value');
    var badge = document.getElementById('trd-carbon-badge');
    if (!el || !badge) return;
    // Badge stays hidden until a real, stored receipt is found — never show
    // an empty "— g · Verified" claim when no receipt exists.
    fetch(verifyUrl, { method: 'GET' })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(body){
        if (!body) return;
        var receipts = body.receipts || body || [];
        if (!Array.isArray(receipts) || receipts.length === 0) return;
        var totalCo2 = 0;
        for (var i = 0; i < receipts.length; i++) {
          var c = Number(receipts[i].carbon_co2_g || (receipts[i].carbon && receipts[i].carbon.co2_grams) || 0);
          if (isFinite(c)) totalCo2 += c;
        }
        el.textContent = totalCo2 > 0
          ? (totalCo2 < 1 ? totalCo2.toFixed(3) + ' g'
             : totalCo2 < 100 ? totalCo2.toFixed(2) + ' g'
             : Math.round(totalCo2) + ' g')
          : '< 0.01 g';
        badge.style.display = 'block';   // reveal ONLY with a real receipt
      })
      .catch(function(){ /* silent — badge stays hidden */ });
  } catch(e){ /* silent */ }
})();
</script>
